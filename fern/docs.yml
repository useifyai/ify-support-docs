# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: ify.docs.buildwithfern.com
title: ify | Documentation
metadata:
  og:site_name: "ify Documentation"
  og:title: "ify | Documentation"
  og:description: "ify is Resolution AI for support teams: an AI agent that resolves tickets end to end on top of Freshdesk, Zendesk, Salesforce, HubSpot or Intercom, billed per verified resolution."
  og:url: "https://ify.docs.buildwithfern.com"
  og:locale: "en_US"
  og:dynamic: true
  twitter:title: "ify Documentation"
  twitter:description: "ify is Resolution AI for support teams: an AI agent that resolves tickets end to end on top of Freshdesk, Zendesk, Salesforce, HubSpot or Intercom, billed per verified resolution."
  twitter:card: summary_large_image
layout:
  searchbar-placement: header
  page-width: full
navigation:
  - page: Welcome to ify
    path: docs/pages/welcome.mdx
    icon: fa-duotone fa-house
  - page: Getting started
    path: docs/pages/getting-started.mdx
    icon: fa-duotone fa-list-check
  - page: Knowledge setup
    path: docs/pages/knowledge-setup.mdx
    icon: fa-duotone fa-books
  - page: Actions and approvals
    path: docs/pages/actions-and-approvals.mdx
    icon: fa-duotone fa-shield-check
  - page: Helpdesk connection guides
    path: docs/pages/helpdesk-connection-guides.mdx
    icon: fa-duotone fa-plug
  - page: Troubleshooting and handoff
    path: docs/pages/troubleshooting-and-handoff.mdx
    icon: fa-duotone fa-life-ring
navbar-links:
  - type: filled
    text: Edit
    url: https://dashboard.buildwithfern.com
colors:
  accent-primary:
    light: "#1D4ED8"
    dark: "#1D4ED8"
  background:
    light: "#F8FAFE"
    dark: "#01040B"
  border:
    light: "#CACDD7"
    dark: "#272B34"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo-dark.png
  light: docs/assets/logo-light.png
  height: 20
  href: https://useify.ai
favicon: docs/assets/favicon.svg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
